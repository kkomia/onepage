{% extends "auth_base.html" %}
{% block title %}初始化 · {{ site_name }}{% endblock %}
{% block content %}
<p class="eyebrow">第一次运行</p>
<h2>先创建你的空间</h2>
<p class="auth-sub">这组信息只在本机写入一次，之后可在管理后台继续调整。</p>

{% if error %}
<div class="form-alert" role="alert">{{ error }}</div>
{% endif %}

<form method="post" action="/setup" class="form-stack form-roomy">
  <div class="form-section">
    <p class="form-section-title">站点</p>
    <label class="field">
      <span class="field-label">站点名称</span>
      <input class="input" type="text" name="site_name" value="{{ site_name_value }}" required maxlength="30">
    </label>
  </div>

  <div class="form-section">
    <p class="form-section-title">系统管理员</p>
    <div class="field-pair">
      <label class="field">
        <span class="field-label">登录账号</span>
        <input class="input" type="text" name="username" value="{{ username }}" autocomplete="username" required maxlength="32" spellcheck="false" placeholder="例如 liu.junhao">
      </label>
      <label class="field">
        <span class="field-label">显示姓名</span>
        <input class="input" type="text" name="display_name" value="{{ display_name }}" autocomplete="name" required maxlength="40" placeholder="例如 刘峻豪">
      </label>
    </div>
    <div class="field-pair">
      <label class="field">
        <span class="field-label">密码</span>
        <input class="input" type="password" name="password" autocomplete="new-password" required minlength="8" maxlength="128">
      </label>
      <label class="field">
        <span class="field-label">确认密码</span>
        <input class="input" type="password" name="password_confirm" autocomplete="new-password" required minlength="8" maxlength="128">
      </label>
    </div>
  </div>

  <div class="form-section">
    <p class="form-section-title">第一个团队空间</p>
    <div class="field-pair">
      <label class="field">
        <span class="field-label">空间名称</span>
        <input class="input" type="text" name="space_name" value="{{ space_name }}" required maxlength="40" placeholder="例如 数据治理组">
      </label>
      <label class="field">
        <span class="field-label">空间标识</span>
        <input class="input" type="text" name="space_slug" value="{{ space_slug }}" required maxlength="40" spellcheck="false" placeholder="例如 data-gov">
        <span class="field-note">用于网址，小写字母、数字或短横线</span>
      </label>
    </div>
  </div>

  <button class="btn btn-primary btn-block" type="submit">
    <span>创建工作空间</span>
    <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-arrow-right"></use></svg>
  </button>
</form>
{% endblock %}
