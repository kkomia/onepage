# OnePage configuration
# All paths are resolved relative to this file (except absolute paths).

# Address to listen on. Put a reverse proxy in front if you need HTTPS.
bind = "0.0.0.0:8686"

# SQLite database and log files live here.
data_dir = "data"

# Optional public address of the site. When it starts with https://,
# session cookies are marked Secure automatically.
# base_url = "https://nav.example.internal"

# Override the automatic Secure-cookie detection (true / false).
# secure_cookies = true

# How long a login stays valid.
session_days = 30

# info / debug / warn
log = "info"

# Fetch site icons (favicon) server-side. Intranet sites only.
icon_fetch = true

# Allow the icon fetcher to contact private / unique-local addresses
# (10/8, 172.16/12, 192.168/16, fc00::/7). Loopback, link-local and cloud
# metadata endpoints such as 169.254.169.254 are refused either way.
# Set to false if you do not need favicons for internal systems.
icon_allow_private = true
